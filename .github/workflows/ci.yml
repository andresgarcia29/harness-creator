name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Las actions van pineadas por SHA de 40, nunca por tag. Un tag es un puntero
# MUTABLE: quien pueda mover el tag v4 de una action corre su codigo dentro de
# este workflow, con el token del repo, sin que cambie una linea de aca. El SHA
# no se puede mover. El comentario al lado dice a que version legible apunta,
# que es lo unico que el SHA no cuenta solo. Para subirla, deliberadamente:
# gh api repos/actions/checkout/git/ref/tags/v4  y cambia SHA y comentario a la
# vez. tests/test_ci_gates.sh falla si una action vuelve a colgar de un tag.
jobs:
  contracts:
    # SOLO LINUX, y es una decisión de costo tomada con un número: los runners
    # de macOS gastan 10 veces los minutos de los de Linux, y un día normal de
    # trabajo (diez pushes) agotó la cuota entera de Actions. Con la cuota
    # agotada NO arranca ningún job, ni el de Linux ni el release: la matriz de
    # dos plataformas no compraba más portabilidad, compraba quedarse sin CI.
    #
    # LO QUE ESTO CUESTA, dicho de frente: una regresión que solo rompa en
    # macOS (bash 3.2 de fábrica, userland BSD) puede aterrizar en main sin que
    # nadie la vea. Este repo ya pagó varias de esa familia (`sed -E` con \b que
    # BSD ignora en silencio, `stat -f` contra `-c`), así que el riesgo no es
    # teórico.
    #
    # DÓNDE SE CUBRE AHORA, que es lo que hace que esto no sea solo aflojar:
    #   · .github/workflows/ci-macos.yml, a pedido y sin gastar un minuto hasta
    #     que alguien lo dispare. El momento para hacerlo es antes de publicar
    #     una versión: el tag sale de main y va a máquinas macOS.
    #   · en cualquier máquina macOS, gratis: `/bin/bash tests/run.sh`, que es
    #     exactamente lo que corre ese workflow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - name: Contratos Python compilan
        run: python3 -m py_compile templates/scripts/evidence.py templates/scripts/harness-policy.py
      - name: Templates shell parsean
        run: |
          bash -n templates/scripts/ship.sh.tmpl
          bash -n templates/scripts/bootstrap.sh.tmpl
          bash -n templates/hooks/block-direct-push.sh
      - name: Suite del installer
        run: bash tests/run.sh

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with: { fetch-depth: 0 }
      - name: la version dice lo mismo en los tres lugares
        # marketplace.json es lo que Claude Code lee para INSTALAR y plugin.json
        # contra lo que `make version` compara. Desalineados, una instancia se
        # reporta al dia contra un numero que nadie publico. Ya paso.
        run: bash scripts/version.sh check

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - name: shellcheck nivel error (gate; warnings son aspiracionales)
        run: |
          shellcheck --version
          shellcheck -S error scripts/*.sh templates/scripts/*.sh templates/hooks/*.sh \
            templates/ui/panel.sh tests/*.sh
