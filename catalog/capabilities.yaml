# Catálogo de capacidades del harness — el MENÚ de la entrevista.
#
# Campos:
#   provider: cli (cero costo de contexto) | mcp (costo fijo por sesión) | script (generado)
#   bin:      binario que doctor.sh verifica con `command -v` (solo provider: cli)
#   mcp:      clave en .mcp.json que doctor.sh verifica (solo provider: mcp)
#   config:   entrada para .mcp.json. Local (stdio): command + args; wrap: true →
#             envolver el comando en scripts/with-secrets.sh (inyección única de
#             secretos). Remoto: type: http|sse + url (sin wrap; el auth es OAuth
#             del cliente, no variables de entorno)
#   install:  UN comando ejecutable, o una URL cuando la instalación es manual.
#             NUNCA prosa: este campo se interpola dentro del bootstrap.sh
#             generado, así que un paréntesis, un "|" o unas comillas no son
#             decoración, son sintaxis de shell que rompe el parseo del ARCHIVO
#             COMPLETO (issue #22: el bootstrap no arrancaba y ninguna
#             dependencia se instalaba). tests/test_catalog.sh lo verifica
#             generando el bootstrap con todo el catálogo y pasándole bash -n.
#   install_alt: la alternativa, para el humano (otro package manager, un
#             self-hosted, una URL). Nadie la ejecuta: por eso aquí sí cabe prosa.
#   permission_tier: read-only | read-write | destructive. La entrevista puede
#             DEGRADAR el tier (ej. github-mcp a read-only); se registra en answers.
#   profiles: qué agentes ven esta capacidad (menos tools = contexto más barato).
#             Perfiles válidos: orquestador (sesión principal), arquitecto,
#             reviewer, implementer, qa, svc (abogados), deployer (scripts), jardinero.
#   detect:   señal del inventory.json que dispara la recomendación | always-recommend
#   phase: 2  → no ofrecerla en la instalación inicial; mencionarla como siguiente paso.
#
# Regla: CLI > MCP siempre que se pueda. Un MCP se gana su lugar.

capabilities:

  # ── Core ──────────────────────────────────────────────
  - name: jq
    category: core
    purpose: "Parseo JSON en scripts del harness (obligatorio: hooks y doctor dependen de él)"
    provider: cli
    bin: jq
    install: "brew install jq"
    install_alt: "apt-get install -y jq"
    permission_tier: read-only
    profiles: [all]
    detect: always

  - name: gh
    category: core
    purpose: "GitHub CLI: estado y logs de Actions (debug de CI), PRs, releases"
    provider: cli
    bin: gh
    install: "brew install gh"
    install_alt: "https://cli.github.com"
    secrets: [{ key: GH_TOKEN, source: "env://GH_TOKEN" }]
    permission_tier: read-write
    profiles: [orquestador, deployer, jardinero]
    detect: "repos con .github/workflows"

  # ── Build por lenguaje ────────────────────────────────
  - name: go-toolchain
    category: build
    purpose: "go build/test/vet + golangci-lint para servicios Go"
    provider: cli
    bin: go
    install: "brew install go golangci-lint"
    permission_tier: read-write
    profiles: [implementer, qa]
    detect: "repos con go.mod"

  - name: node-toolchain
    category: build
    purpose: "bun/npm + tsc --noEmit para frontends TS"
    provider: cli
    bin: npm
    install: "brew install node"
    install_alt: "brew install oven-sh/bun/bun"
    permission_tier: read-write
    profiles: [implementer, qa]
    detect: "repos con package.json"

  - name: python-toolchain
    category: build
    purpose: "uv + ruff + pytest para servicios Python"
    provider: cli
    bin: uv
    install: "brew install uv"
    permission_tier: read-write
    profiles: [implementer, qa]
    detect: "repos con pyproject.toml"

  - name: flutter-toolchain
    category: build
    purpose: "flutter analyze/test para mobile"
    provider: cli
    bin: flutter
    install: "https://docs.flutter.dev/get-started"
    permission_tier: read-write
    profiles: [implementer, qa]
    detect: "repos con pubspec.yaml"

  # ── Contratos ─────────────────────────────────────────
  - name: buf
    category: contracts
    purpose: "Lint + breaking-change detection de protobuf. GATE DURO en ship.sh"
    provider: cli
    bin: buf
    install: "brew install bufbuild/buf/buf"
    permission_tier: read-only
    profiles: [implementer, arquitecto, reviewer]
    detect: "repos con buf.yaml"

  # ── Infra / CD (writes SOLO por GitOps) ───────────────
  - name: kubectl
    category: infra
    purpose: "Estado del cluster; diagnóstico en rojo. Write vía GitOps, nunca kubectl apply"
    provider: cli
    bin: kubectl
    install: "gcloud components install kubectl"
    secrets: [{ key: KUBECONFIG, source: "vault://<project>/harness/kubeconfig" }]
    permission_tier: read-only
    profiles: [deployer, orquestador]
    detect: "repos con charts de Helm o manifests k8s"

  - name: gcloud
    category: infra
    purpose: "GCP: logs, estado de recursos. Soporta keyless (token efímero vía Vault)"
    provider: cli
    bin: gcloud
    install: "brew install --cask gcloud-cli"
    secrets: [{ key: CLOUDSDK_AUTH_ACCESS_TOKEN, source: "vault://gcp/impersonated-account" }]
    permission_tier: read-only
    profiles: [deployer, orquestador]
    detect: "terraform con provider google"

  - name: argocd
    category: infra
    purpose: "Health y sync de apps post-promoción (lo usa deploy-watch.sh)"
    provider: cli
    bin: argocd
    install: "brew install argocd"
    secrets: [{ key: ARGOCD_AUTH_TOKEN, source: "vault://<project>/harness/argocd" }]
    permission_tier: read-only
    profiles: [deployer]
    detect: "manifests de ArgoCD"

  - name: kargo
    category: infra
    purpose: "Verificar promociones de freight en el pipeline CD"
    provider: cli
    bin: kargo
    install: "brew install akuity/tap/kargo-cli"
    secrets: [{ key: KARGO_TOKEN, source: "vault://<project>/harness/kargo" }]
    permission_tier: read-only
    profiles: [deployer]
    detect: "manifests de Kargo"

  - name: terraform
    category: infra
    purpose: "plan/validate en repos de infra (apply SIEMPRE humano o CI)"
    provider: cli
    bin: terraform
    install: "brew install terraform"
    permission_tier: read-only
    profiles: [implementer, svc]
    detect: "repos con *.tf"

  - name: vault
    category: infra
    purpose: "HashiCorp Vault CLI: fuente única de secretos; secrets.sh lo materializa a .secrets"
    provider: cli
    bin: vault
    install: "brew install hashicorp/tap/vault"
    secrets: [{ key: VAULT_TOKEN, source: "file://~/.config/harness/vault-token (chmod 600, fuera del repo)" }]
    permission_tier: read-write
    profiles: [orquestador, deployer]
    detect: "elegido en entrevista (secrets.source: vault)"

  # ── Calidad / sensores ────────────────────────────────
  - name: gitleaks
    category: quality
    purpose: "Scan de secretos sobre el rango a pushear. OBLIGATORIO en direct-to-prod"
    provider: cli
    bin: gitleaks
    install: "brew install gitleaks"
    permission_tier: read-only
    profiles: [all]
    detect: always-recommend

  - name: semgrep
    category: quality
    purpose: "Reglas custom multi-lenguaje CON mensaje de remediación (menos iteraciones de loop). Gate en ship.sh"
    provider: cli
    bin: semgrep
    install: "brew install semgrep"
    install_alt: "uv tool install semgrep"
    permission_tier: read-only
    profiles: [implementer, qa, reviewer]
    detect: always-recommend

  # Tests estructurales de arquitectura = GATE (la dirección de
  # dependencias como invariante mecánico — el patrón del 1M de líneas
  # de OpenAI). Fase 1, no opcional, donde el lenguaje exista.
  - name: dependency-cruiser
    category: quality
    purpose: "Fronteras de módulos/capas en TS como GATE (la dirección de dependencias es ley)"
    # A diferencia de import-linter/go-arch-lint (gates genéricos en ship.sh,
    # activados por config), la invocación de depcruise depende del layout del
    # repo (src dir + variante de config): cablearlo es añadir su comando al
    # script de test del package.json — ship.sh lo corre vía npm test.
    provider: cli
    bin: depcruise
    install: "npm i -g dependency-cruiser"
    permission_tier: read-only
    profiles: [implementer, reviewer]
    detect: "repos con package.json"

  - name: import-linter
    category: quality
    purpose: "Fronteras de capas en Python como GATE"
    provider: cli
    bin: lint-imports
    install: "pip install import-linter"
    permission_tier: read-only
    profiles: [implementer, reviewer]
    detect: "repos con pyproject.toml"

  - name: go-arch-lint
    category: quality
    purpose: "Fronteras de capas en Go como GATE (.go-arch-lint.yml declara el grafo permitido)"
    provider: cli
    bin: go-arch-lint
    install: "go install github.com/fe3dback/go-arch-lint@latest"
    permission_tier: read-only
    profiles: [implementer, reviewer]
    detect: "repos con go.mod"

  - name: ast-grep
    category: quality
    purpose: "Reglas AST YAML con autofix, mucho más rápido que semgrep; el rule-miner escribe reglas aquí"
    provider: cli
    bin: sg
    install: "brew install ast-grep"
    permission_tier: read-only
    profiles: [implementer, reviewer]
    detect: always-recommend
    phase: 2
    note: "sin soporte Dart built-in; semgrep/opengrep cubre lo multi-lenguaje"

  # ── Economía de tokens ────────────────────────────────
  - name: quiet-wrapper
    category: token-economy
    purpose: "scripts/quiet.sh: outputs ruidosos (kubectl logs, gh run view) → head+tail + dump completo en .cache/quiet/"
    provider: script
    install: "generado por el harness en scripts/"
    permission_tier: read-only
    profiles: [all]
    detect: always-recommend

  - name: graphify
    category: token-economy
    purpose: "Knowledge graph cross-repo (Tree-sitter+Leiden): preguntas de comprensión al grafo, no grep masivo (~71× menos tokens)"
    provider: cli
    bin: graphify
    install: "uv tool install graphifyy"   # doble y: así se llama el paquete en PyPI; el binario es graphify
    post_install: "graphify install"        # registra la skill /graphify en los asistentes (Claude Code, Cursor, Codex…)
    permission_tier: read-only
    profiles: [arquitecto, jardinero, orquestador]
    detect: "workspace con 5+ repos"

  - name: semble
    category: token-economy
    purpose: "Búsqueda semántica local (CPU-only, sin API keys): '¿dónde está X?' sin abrir 20 archivos"
    provider: cli
    bin: semble
    install: "uv tool install semble"
    permission_tier: read-only
    profiles: [orquestador, implementer]
    detect: always-recommend
    phase: 2

  - name: ccusage
    category: token-economy
    purpose: "Costo por tarea/fase — la báscula del harness. Correr ANTES de optimizar nada"
    provider: cli
    bin: ccusage
    install: "npm i -g ccusage"
    permission_tier: read-only
    profiles: [orquestador]
    detect: always-recommend

  # ── MCPs (se ganan su lugar; costo fijo por sesión) ──
  - name: serena
    category: mcp
    purpose: "Retrieval y edición SIMBÓLICA vía LSP — el ahorro de tokens más grande en implementación"
    provider: mcp
    mcp: serena
    config: { command: "uvx", args: ["--from", "git+https://github.com/oraios/serena", "serena", "start-mcp-server", "--context", "ide-assistant", "--enable-web-dashboard", "false"] }
    permission_tier: read-write
    profiles: [implementer]
    detect: always-recommend
    note: "multi-repo: Serena es POR-PROYECTO — el implementer DEBE activate_project sobre su worktree al arrancar (el template ya lo instruye); sin eso las tools simbólicas no operan. Dashboard deshabilitado (se abría en cada sesión). Desactivar sus tools básicos de archivo (Claude Code ya los trae)"

  - name: context7
    category: mcp
    purpose: "Docs de librerías bajo demanda — no web-search repetido de la misma API"
    provider: mcp
    mcp: context7
    config: { command: "npx", args: ["-y", "@upstash/context7-mcp"] }
    permission_tier: read-only
    profiles: [implementer, arquitecto]
    detect: always-recommend

  - name: playwright
    category: mcp
    purpose: "QA de frontends y smoke del canary tenant"
    provider: mcp
    mcp: playwright
    config: { command: "npx", args: ["@playwright/mcp@latest"] }
    permission_tier: read-write
    profiles: [qa]
    detect: "repos frontend"

  - name: engram
    category: mcp
    purpose: "Memoria episódica del harness (mem_search al iniciar, mem_save al cerrar)"
    provider: mcp
    mcp: engram
    config: { command: "engram", args: ["mcp", "--project", "{{PROJECT_SLUG}}"] }
    bin: engram
    install: "brew install gentleman-programming/tap/engram"
    permission_tier: read-write
    profiles: [orquestador, arquitecto]   # NUNCA en implementers
    detect: always-recommend
    note: "fijar --project explícito; no derivar del remote"

  - name: github-mcp
    category: mcp
    purpose: "Runs/logs de Actions estructurados (debug de CI en rojo). Redundante si gh CLI basta"
    provider: mcp
    mcp: github
    config: { command: "docker", args: ["run", "-i", "--rm", "-e", "GITHUB_PERSONAL_ACCESS_TOKEN", "ghcr.io/github/github-mcp-server", "stdio"], wrap: true }
    secrets: [{ key: GITHUB_PERSONAL_ACCESS_TOKEN, source: "vault://<project>/harness/github" }]
    permission_tier: read-write
    profiles: [deployer, orquestador]
    detect: "repos con .github/workflows"

  - name: kubernetes-mcp
    category: mcp
    purpose: "Pods/logs/exec estructurados en el cluster (diagnóstico en rojo)"
    provider: mcp
    mcp: kubernetes
    config: { command: "npx", args: ["kubernetes-mcp-server@latest"], wrap: true }
    secrets: [{ key: KUBECONFIG, source: "vault://<project>/harness/kubeconfig" }]
    permission_tier: read-only
    profiles: [deployer, orquestador]
    detect: "cluster k8s (helm/argocd en inventory)"

  - name: argocd-mcp
    category: mcp
    purpose: "Estado/sync de deploys estructurado. Redundante si argocd CLI + deploy-watch bastan"
    provider: mcp
    mcp: argocd
    config: { command: "npx", args: ["argocd-mcp@latest", "stdio"], wrap: true }
    secrets: [{ key: ARGOCD_AUTH_TOKEN, source: "vault://<project>/harness/argocd" }]
    permission_tier: read-only
    profiles: [deployer]
    detect: "manifests de ArgoCD"

  - name: grafana-mcp
    category: mcp
    purpose: "Dashboards + Prometheus + Loki para diagnóstico post-deploy"
    provider: mcp
    mcp: grafana
    config: { command: "uvx", args: ["mcp-grafana"], wrap: true }
    secrets: [{ key: GRAFANA_TOKEN, source: "vault://<project>/harness/grafana" }]
    permission_tier: read-only
    profiles: [deployer, orquestador]
    detect: "elegido en entrevista (observabilidad)"

  - name: vault-mcp
    category: mcp
    purpose: "Lectura de secretos + escritura SOLO del app-plane (policy dedicada; platform/infra denegados)"
    provider: mcp
    mcp: vault
    config: { command: "docker", args: ["run", "-i", "--rm", "-e", "VAULT_ADDR", "-e", "VAULT_TOKEN", "hashicorp/vault-mcp-server"], wrap: true }
    secrets: [{ key: VAULT_ADDR, source: "env://VAULT_ADDR" }, { key: VAULT_TOKEN, source: "env://VAULT_TOKEN" }]
    permission_tier: read-write
    profiles: [orquestador]
    detect: "elegido en entrevista (secrets.source: vault)"
    note: "exigir policy de Vault que deniegue platform/infra; los valores JAMÁS pasan por el chat"

  # ── Tracking ──────────────────────────────────────────
  - name: linear-bridge
    category: tracking
    purpose: "ticket-pull.sh / ticket-close.sh (API GraphQL vía curl, cero tokens en el loop)"
    provider: script
    install: "generado por el harness en scripts/"
    secrets: [{ key: LINEAR_API_KEY, source: "vault://<project>/harness/linear" }]
    permission_tier: read-write
    profiles: [orquestador]
    detect: "tickets.provider: linear"

  - name: linear-mcp
    category: tracking
    purpose: "MCP oficial de Linear — intake conversacional y menos fricción de red que curl. Los scripts siguen para el loop (cero tokens); este es para explorar/triage"
    provider: mcp
    mcp: linear
    config: { command: "npx", args: ["-y", "mcp-remote", "https://mcp.linear.app/sse"] }
    permission_tier: read-write
    profiles: [orquestador]
    detect: "tickets.provider: linear"
    phase: 2

  - name: beads
    category: tracking
    purpose: "DAG de tareas git-backed para agentes (bd ready --json). Beads=estado del trabajo; Engram=conocimiento. v1.1+ trae bd linear sync nativo"
    provider: cli
    bin: bd
    install: "brew install beads"
    permission_tier: read-write
    profiles: [orquestador, arquitecto, implementer]
    detect: always-recommend

  # ── Testing avanzado (auditan a los agentes-testers) ──
  - name: gotestsum
    category: testing
    purpose: "Runner Go con JUnit XML (insumo del flake-warden) y --rerun-fails acotado"
    provider: cli
    bin: gotestsum
    install: "go install gotest.tools/gotestsum@latest"
    permission_tier: read-only
    profiles: [implementer, qa]
    detect: "repos con go.mod"

  - name: diff-cover
    category: testing
    purpose: "Cobertura DEL DIFF (no global) como ratchet — funciona con lcov/cobertura de los 4 lenguajes"
    provider: cli
    bin: diff-cover
    install: "pip install diff-cover"
    permission_tier: read-only
    profiles: [reviewer]
    detect: always-recommend
    cronjob: ratchet-keeper

  - name: stryker
    category: testing
    purpose: "Mutation testing TS incremental (los tests de IA que no protegen, desenmascarados). Dev-dep POR REPO TS, no global"
    provider: cli
    bin: npx
    install: "npm i -D @stryker-mutator/core"
    permission_tier: read-only
    profiles: []
    detect: "repos con package.json"
    cronjob: mutation-sentinel
    phase: 2

  - name: mutmut
    category: testing
    purpose: "Mutation testing Python incremental (requiere pytest, corre en el CronJob Linux)"
    provider: cli
    bin: mutmut
    install: "pip install mutmut"
    permission_tier: read-only
    profiles: []
    detect: "repos con pyproject.toml"
    cronjob: mutation-sentinel
    phase: 2

  - name: go-mutesting
    category: testing
    purpose: "Mutation testing Go (scope SIEMPRE a paquetes cambiados; sin caché incremental)"
    provider: cli
    bin: go-mutesting
    install: "go install github.com/avito-tech/go-mutesting/cmd/go-mutesting@latest"
    permission_tier: read-only
    profiles: []
    detect: "repos con go.mod"
    cronjob: mutation-sentinel
    phase: 2

  - name: k6
    category: testing
    purpose: "Load testing con thresholds (p95, error rate) que fallan el build; habla gRPC nativo"
    provider: cli
    bin: k6
    install: "brew install k6"
    permission_tier: read-only
    profiles: [qa]
    detect: "servicios gRPC/HTTP"
    phase: 2

  # ── Higiene de código (detectores de los cronjobs) ────
  - name: knip
    category: hygiene
    purpose: "Código muerto en TS (exports/deps/archivos sin uso), reporter JSON"
    provider: cli
    bin: knip
    install: "npm i -g knip"
    permission_tier: read-only
    profiles: []
    detect: "repos con package.json"
    cronjob: dead-code-reaper

  - name: vulture
    category: hygiene
    purpose: "Código muerto en Python (usar --min-confidence 90 + whitelist committeada)"
    provider: cli
    bin: vulture
    install: "pip install vulture"
    permission_tier: read-only
    profiles: []
    detect: "repos con pyproject.toml"
    cronjob: dead-code-reaper

  - name: deadcode
    category: hygiene
    purpose: "Código muerto en Go (oficial x/tools, -json -whylive)"
    provider: cli
    bin: deadcode
    install: "go install golang.org/x/tools/cmd/deadcode@latest"
    permission_tier: read-only
    profiles: []
    detect: "repos con go.mod"
    cronjob: dead-code-reaper

  - name: jscpd
    category: hygiene
    purpose: "Duplicación multi-lenguaje (cubre Go/Py/TS/Dart en una pasada; reporter AI token-eficiente)"
    # SIN consumidor automático aún: ningún gate/cronjob lo corre. Ofrécelo
    # solo si el humano lo pide; candidato a check del reviewer en el futuro.
    provider: cli
    bin: jscpd
    install: "npm i -g jscpd"
    permission_tier: read-only
    profiles: []
    detect: always-recommend
    cronjob: dead-code-reaper
    phase: 2

  # ── Dependencias y supply chain ───────────────────────
  - name: renovate
    category: security
    purpose: "Updates de deps con minimumReleaseAge:14d (defensa supply-chain) + automerge con CI verde. Cubre pub/Flutter"
    provider: cli
    bin: renovate
    install: "npm i -g renovate"
    install_alt: "CronJob oficial self-hosted (https://docs.renovatebot.com/self-hosting)"
    secrets: [{ key: RENOVATE_TOKEN, source: "vault://<project>/harness/github" }]
    permission_tier: read-write
    profiles: []
    detect: always-recommend
    cronjob: dep-shepherd

  - name: osv-scanner
    category: security
    purpose: "Vulns de deps en los 4 ecosistemas (incluye Dart), SARIF"
    provider: cli
    bin: osv-scanner
    install: "brew install osv-scanner"
    permission_tier: read-only
    profiles: []
    detect: always-recommend
    cronjob: vuln-watch

  - name: trivy
    category: security
    purpose: "Vulns + secretos + IaC en una pasada (complementa gitleaks en cron)"
    provider: cli
    bin: trivy
    install: "brew install trivy"
    permission_tier: read-only
    profiles: []
    detect: always-recommend
    cronjob: vuln-watch

  - name: cosign
    category: security
    purpose: "Firma keyless de imágenes + verificación en deploy: ningún agente despliega una imagen que no salió del pipeline"
    # Se cablea en el CI del repo (sign en build, verify en admission/deploy),
    # NO en prompts del harness — el instalador solo lo instala y lo documenta.
    provider: cli
    bin: cosign
    install: "brew install cosign"
    permission_tier: read-write
    profiles: [deployer]
    detect: "repos con Dockerfile + CD"
    phase: 2

  # ── Datos / deploy seguro ─────────────────────────────
  - name: squawk
    category: deploy
    purpose: "Lint de migraciones Postgres: detecta ALTERs bloqueantes e índices sin CONCURRENTLY. GATE en direct-to-prod"
    provider: cli
    bin: squawk
    install: "npm i -g squawk-cli"
    permission_tier: read-only
    profiles: [implementer, reviewer]
    detect: "repos con migraciones SQL"

  - name: goose
    category: deploy
    purpose: "Migraciones versionadas embebibles en el binario Go o como promotion step de Kargo. Disciplina expand/contract"
    provider: cli
    bin: goose
    install: "brew install goose"
    permission_tier: read-write
    profiles: [implementer]
    detect: "repos con migraciones SQL"

  - name: protovalidate
    category: contracts
    purpose: "Validación COMO PARTE del contrato proto (una fuente de reglas, interceptores Go/Py/TS). Dart: valida el servidor. Es DEPENDENCIA del repo proto, no un CLI que se instale aquí"
    provider: cli
    bin: buf
    install: "https://buf.build/bufbuild/protovalidate"
    permission_tier: read-only
    profiles: [implementer, arquitecto]
    detect: "repos con buf.yaml"

  - name: sloth
    category: deploy
    purpose: "SLOs → recording rules multi-burn-rate; los AnalysisTemplates y el slo-watchdog leen burn rate, no error rate crudo"
    # Herramienta de PLATAFORMA: genera las rules que Prometheus evalúa y que
    # alimentan el webhook del slo-watchdog. Corre en CI de infra, no en agentes.
    provider: cli
    bin: sloth
    install: "brew install slok/tap/sloth"
    permission_tier: read-only
    profiles: [deployer]
    detect: "prometheus en el stack"
    phase: 2

  - name: unleash
    category: deploy
    purpose: "Feature flags OSS (OpenFeature-compatible, SDK Flutter oficial): deploy≠release en direct-to-prod; webhook de flags stale → PR de limpieza. Se despliega self-hosted (helm chart): no hay CLI local que instalar"
    provider: cli
    install: "https://docs.getunleash.io/using-unleash/deploy/getting-started"
    permission_tier: read-write
    profiles: [implementer, deployer]
    detect: "elegido en entrevista (direct-to-prod)"
    phase: 2

  # ── Docs / diagramas (detectores del doc-gardener) ────
  - name: lychee
    category: docs
    purpose: "Links rotos en docs/ y CLAUDE.md (detector del doc-gardener)"
    provider: cli
    bin: lychee
    install: "brew install lychee"
    permission_tier: read-only
    profiles: []
    detect: always-recommend
    cronjob: doc-gardener

  - name: d2
    category: docs
    purpose: "Diagramas regenerables desde texto (binario estático, determinista, sketch mode). Un diagrama que no se regenera está muerto"
    provider: cli
    bin: d2
    install: "brew install d2"
    permission_tier: read-only
    profiles: [jardinero, arquitecto]
    detect: always-recommend
    cronjob: doc-gardener

  # ── MCPs adicionales ──────────────────────────────────
  - name: sentry-mcp
    category: mcp
    purpose: "Error tracking para triage agéntico (Sentry SaaS con Seer; alternativa self-hosted: GlitchTip 6.1 con MCP integrado)"
    provider: mcp
    mcp: sentry
    config: { command: "npx", args: ["-y", "@sentry/mcp-server"], wrap: true }
    secrets: [{ key: SENTRY_AUTH_TOKEN, source: "vault://<project>/harness/sentry" }]
    permission_tier: read-only
    profiles: [deployer, orquestador]
    detect: "sentry sdk en repos"
    phase: 2
    note: "no dejar que el agente actúe automáticamente sobre stack traces (prompt injection vía contenido de errores)"

  - name: gke-mcp
    category: mcp
    purpose: "GKE nativo de Google (clusters, workloads, logs) — complementa kubernetes-mcp"
    provider: mcp
    mcp: gke
    config: { command: "gke-mcp", args: [], wrap: true }
    permission_tier: read-only
    profiles: [deployer]
    detect: "GKE en el stack"
    phase: 2

  - name: meta-devtools-mcp
    category: mcp
    purpose: "MCP oficial de Meta (beta): config de apps, estado de App Review, compliance, uso/rate limits de la Graph API, webhooks y búsqueda de docs, sin abrir el dashboard de developers.facebook.com"
    provider: mcp
    mcp: meta_developer_tools
    config: { type: "http", url: "https://mcp.facebook.com/devtools" }
    permission_tier: read-only
    profiles: [orquestador, implementer]
    detect: "APIs de Meta en el stack (Graph API, WhatsApp Cloud API, Instagram, Facebook Login, webhooks de Meta)"
    phase: 2
    note: "remoto (streamable HTTP) con OAuth de cuenta de developer: cero secretos en config, pero exige `/mcp` → authenticate al arrancar el cliente (no sirve en cron ni headless). Scope Read por default; Manage solo si de verdad se necesita crear/borrar suscripciones de webhooks (único write del server) y sube el tier a read-write. Beta con rollout gradual: puede no estar habilitado en la cuenta, y el set de tools puede cambiar. Los 10 tools traen contenido externo (docs, payloads de webhooks): tratarlo como no confiable, sin accionar automático"
